[package]
name = "stork"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stork"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
solana-keccak-hasher = "3.1.0"
solana-secp256k1-recover = "3.1.0"
solana-system-interface = "2.0.0"
stork-solana-sdk = { path = "../../../sdks/stork-solana-sdk" }

[dev-dependencies]
# Host unit tests cannot use the Keccak syscall. On-chain builds keep the syscall path.
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
