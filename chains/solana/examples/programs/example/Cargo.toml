[package]
name = "example"
version = "0.1.0"
description = "Example program using Stork SDK"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "example"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.1"
stork-solana-sdk = { path = "../../../sdks/stork-solana-sdk" }
hex = "0.4.3"
