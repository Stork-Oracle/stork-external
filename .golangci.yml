version: "2"
linters:
  default: all
  disable:
    - testpackage
    # replaced by new major versions, which `default: all` enables
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    cyclop:
      # golangci-lint 2.13 tightened the complexity linters against unchanged
      # code. Raised just enough for pusher.Run (16); the genuinely complex
      # functions carry //nolint directives, as they already did here.
      max-complexity: 16
    depguard:
      rules:
        blacklist:
          deny:
            - pkg: "github.com/go-test/testify"
              desc: use github.com/stretchr/testify
    errcheck:
      check-type-assertions: true
    exhaustruct_v5:
      ignore-patterns:
        # generated Sui gRPC protobuf types
        - ^github.com/Stork-Oracle/stork-external/apps/chain_pusher/pkg/sui/rpc/v2\..+$
        - ^google.golang.org/protobuf/types/known/fieldmaskpb.FieldMask$
        - ^crypto/tls.Config$
        # std libs
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        # public libs
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
        - ^github.com/gorilla/websocket.Dialer$
        - ^github.com/gorilla/websocket.Conn$
        - ^github.com/Stork-Oracle/go-sui-sdk/v2/types.+$
        - ^github.com/Stork-Oracle/go-sui-sdk/v2/sui_types.+$
        - ^github.com/gagliardetto/binary.Int128$
        - ^github.com/ethereum/go-ethereum/accounts/abi/bind.WatchOpts$
        - ^github.com/cosmos/cosmos-sdk/client.Context$
        - ^github.com/aptos-labs/aptos-go-sdk/crypto.Ed25519PrivateKey$
        # generated internal libs
        - ^github.com/Stork-Oracle/stork-external/apps/chain_pusher/pkg/solana/bindings.+$
        - ^github.com/Stork-Oracle/stork-external/apps/chain_pusher/pkg/initia_minimove/bindings.+$
    embeddedstructfieldcheck:
      forbid-mutex: true
    exhaustive:
      check:
        - switch
        - map
    funlen:
      lines: 100
    gocritic:
      settings:
        ifElseChain:
          minThreshold: 3
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G108
    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true
    mnd:
      # List of function patterns to exclude from analysis.
      # Values always ignored: `time.Date`,
      # `strconv.FormatInt`, `strconv.FormatUint`, `strconv.FormatFloat`,
      # `strconv.ParseInt`, `strconv.ParseUint`, `strconv.ParseFloat`.
      # Default: []
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets
    reassign:
      patterns:
        - ".*"
    revive:
      rules:
        - name: var-naming
          arguments:
            - ["RPC", "URL"]
            - []
            - - skip-package-name-checks: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008
        # Taken care of by revive var-naming
        - -ST1003
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          xml: snake
          bson: snake
          env: upperSnake
          envconfig: upperSnake
        use-field-name: true
    varnamelen:
      max-distance: 25
      min-name-length: 2
      ignore-names:
        - err
        - ctx
        - db
        - id
        - ok
        - tx
        - wg
        - mu
        - rw
      ignore-decls:
        - c echo.Context
        - t testing.T
        - e error
        - i int
        - j int
        - T any
        - m map[string]int
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # ireturn reports this factory at the preceding const block rather than
      # the function, so an inline //nolint cannot match. Returning the
      # interface is the whole point of a factory.
      - linters:
          - ireturn
        path: apps/chain_pusher/pkg/evm/nonce_manager\.go
      - linters:
          - funlen
          - maintidx
        source: ^func Test
      - linters:
          - exhaustruct_v5
          - lll
        path: _test.go
      - linters:
          - dupl
          - gochecknoglobals
          - paralleltest
        path: lib/service
      - linters:
          - mnd
          - funlen
          - exhaustruct_v5
        path: testutil/*
    paths:
      - mock_*.go
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
      reformat-tags: false
  exclusions:
    generated: lax
    paths:
      # gci and gofumpt disagree about the indentation of the struct literal
      # in this file and each undoes the other. gofmt accepts the gofumpt
      # form, so gci is skipped here.
      - apps/chain_pusher/internal/testutil/interactor_price_case.go
      - mock_*.go
      - third_party$
      - builtin$
      - examples$
